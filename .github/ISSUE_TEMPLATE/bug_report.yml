name: Bug report
description: Report a reproducible HyperMax problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the actual behavior and expected behavior.
    validations:
      required: true
  - type: input
    id: nvim
    attributes:
      label: Neovim version
      placeholder: "nvim --version"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output or logs
      description: Remove secrets and private project content.
    validations:
      required: false
