name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lua quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Lua types with Lua Language Server
        uses: mrcjkb/lua-typecheck-action@v0
        with:
          checklevel: Error
          directories: |
            lua
            plugin
          configpath: ".luarc.json"

      - name: Install Lua 5.1 and LuaRocks
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1 luarocks

      - name: Install Lua development tools
        run: |
          luarocks --lua-version=5.1 install luacheck
          luarocks --lua-version=5.1 install busted

      - name: Lint Lua sources and Busted specifications
        run: luacheck lua plugin spec --config .luacheckrc

      - name: Check Lua 5.1 syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            luac5.1 -p "$file"
          done < <(find lua plugin tests spec -type f -name '*.lua' -print0)

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          version: v0.10.4
          neovim: true

      - name: Check files with Neovim's Lua runtime
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            CHECK_FILE="$file" nvim --headless -u NONE -c 'lua assert(loadfile(vim.env.CHECK_FILE))' -c 'qa!'
          done < <(find lua plugin tests spec -type f -name '*.lua' -print0)

      - name: Run Busted unit specifications
        run: busted --verbose spec

      - name: Run Neovim integration suite
        run: nvim --headless -u NONE -c "set rtp+=." -c "luafile tests/run.lua"
